[package]
name = "claude-notify-app"
version = "0.1.0"
edition = "2021"
description = "Claude Notify — desktop GUI for monitoring Claude.ai usage limits"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
