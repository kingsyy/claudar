[package]
name = "claude-notify-app"
version = "0.1.0"
edition = "2021"
description = "Claude Notify — desktop GUI for monitoring Claude.ai usage limits"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.2", features = ["tray-icon", "image-png", "webview-data-url"] }
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
claude-notify-core = { path = "../crates/claude-notify-core" }
tokio = { version = "1.42", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
notify-rust = "4.10"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json"] }
open = "5.0"
futures = "0.3"
