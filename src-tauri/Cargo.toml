[package]
name = "claude-notify-app"
version = "0.1.0"
edition = "2021"
description = "Claude Notify — desktop GUI for monitoring Claude.ai usage limits"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
claude-notify-core = { path = "../crates/claude-notify-core" }
tokio = { version = "1.42", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
