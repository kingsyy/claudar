[workspace]
members = [
    ".",
    "crates/claude-notify-core",
    "src-tauri",
]
resolver = "2"

[package]
name = "claude-notify"
version = "0.3.0"
edition = "2021"
description = "Monitor your Claude.ai usage limits and get native desktop notifications before hitting rate limits"
license = "MIT"
repository = "https://github.com/kingsyy/claude-notify"
authors = ["kingsyy"]
keywords = ["claude", "monitoring", "notifications", "usage", "rate-limit"]
categories = ["command-line-utilities"]

[dependencies]
claude-notify-core = { path = "crates/claude-notify-core" }
tokio = { version = "1.42", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies", "blocking", "rustls-tls", "gzip", "brotli"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify-rust = "4.11"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
uuid = { version = "1.11", features = ["serde"] }
anyhow = "1.0"
dialoguer = "0.11"
colored = "2.1"
rand = "0.8"
indicatif = "0.17"

[dev-dependencies]
mockito = "1.2"
tempfile = "3.8"
