name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  notes:
    name: Extract release notes
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Extracted once, on Linux: the build matrix includes Windows, where the
      # awk-based script would depend on Git Bash being on PATH.
      - name: Extract this version's CHANGELOG section
        id: changelog
        run: |
          {
            echo "body<<CHANGELOG_EOF"
            scripts/changelog-extract.sh "${{ github.ref_name }}"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: notes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: linux
            os: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows
            os: windows-latest
            args: ""
            rust-targets: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cargo cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build frontend
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. This is separate from Apple/Authenticode
          # code signing -- it is the minisign key the shipped app verifies before
          # it will install anything. Generate with `cargo tauri signer generate`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Claudar ${{ github.ref_name }}"
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          # Publishes latest.json alongside the bundles; the app's updater
          # endpoint points at the latest release's copy.
          includeUpdaterJson: true
          # Frontend is prebuilt above; the CI config override blanks the
          # in-config beforeBuildCommand (its `npm run build` resolves against
          # ui/, not the repo root). Path is relative to projectPath.
          args: ${{ matrix.args }} --config tauri.conf.ci.json
