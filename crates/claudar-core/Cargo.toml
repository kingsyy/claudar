[package]
name = "claudar-core"
version = "0.3.0"
edition = "2021"
description = "Core library for claudar: monitoring, usage fetching, config, and notifications"
license = "MIT"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls", "gzip", "brotli"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify-rust = "4.11"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
toml = "0.8"
tracing = "0.1"
dirs = "5.0"
uuid = { version = "1.11", features = ["serde"] }
anyhow = "1.0"
rand = "0.8"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
aes-gcm = "0.10"
base64 = "0.22"

[dev-dependencies]
mockito = "1.2"
tempfile = "3.8"
tokio = { version = "1.42", features = ["full", "test-util"] }
